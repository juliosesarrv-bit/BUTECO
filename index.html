<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>BUTECO PREMIUM</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: #fff;
}

header {
  background: #111;
  padding: 15px;
  text-align: center;
  border-bottom: 2px solid gold;
}

h1 {
  color: gold;
}

.container {
  display: grid;
  grid-template-columns: 300px 1fr 300px;
  gap: 15px;
  padding: 15px;
}

/* PLAYER */
.player {
  background: #111;
  padding: 15px;
  border-radius: 10px;
}

.player img {
  width: 100%;
  border-radius: 10px;
}

button {
  background: gold;
  border: none;
  padding: 10px;
  width: 100%;
  cursor: pointer;
  margin-top: 10px;
}

/* CHAT */
.chat {
  background: #111;
  padding: 10px;
  border-radius: 10px;
}

/* HISTÓRICO */
.history {
  background: #111;
  padding: 10px;
  border-radius: 10px;
  height: 200px;
  overflow-y: auto;
}

/* SOCIAL */
.social a {
  display: block;
  background: #222;
  margin: 5px 0;
  padding: 10px;
  text-decoration: none;
  color: #fff;
  border-radius: 5px;
}

.social a:hover {
  background: gold;
  color: #000;
}
</style>
</head>

<body>

<header>
  <h1>🎙️ BUTECO PREMIUM</h1>
  <p>24 HORAS COM VOCÊ</p>
</header>

<div class="container">

  <!-- PLAYER -->
  <div class="player">
    <img id="cover" src="https://via.placeholder.com/300x300?text=Sem+Capa">
    <h3 id="music">Carregando...</h3>
    <audio id="audio" src="SEU_STREAM_AQUI" controls autoplay></audio>
    <button onclick="play()">▶️ Play</button>
  </div>

  <!-- CHAT (NO LUGAR DA IMAGEM) -->
  <div class="chat">
    <iframe src="https://xat.com/embed/chat.php#id=220535412&gn=Butecopremium"
    width="100%" height="500" frameborder="0"></iframe>
  </div>

  <!-- LADO DIREITO -->
  <div>

    <div class="history">
      <h3>🎵 Histórico</h3>
      <ul id="historyList"></ul>
    </div>

    <div class="social">
      <h3>🌐 Redes</h3>
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="#">Discord</a>
    </div>

  </div>

</div>

<script>
const api = "http://igng.com.br/api/TnpBeE9BPT0rWg==";

let history = [];

async function getMusic() {
  try {
    const res = await fetch(api);
    const data = await res.json();

    const musica = data.currentSong || data.title || "Desconhecido";

    document.getElementById("music").innerText = musica;

    // histórico
    if (!history.includes(musica)) {
      history.unshift(musica);
      if (history.length > 10) history.pop();

      let list = document.getElementById("historyList");
      list.innerHTML = "";
      history.forEach(m => {
        let li = document.createElement("li");
        li.innerText = m;
        list.appendChild(li);
      });
    }

    buscarCapa(musica);

  } catch (e) {
    console.log("Erro API");
  }
}

// BUSCAR CAPA (Apple Music fake search)
async function buscarCapa(nome) {
  try {
    let url = `https://itunes.apple.com/search?term=${encodeURIComponent(nome)}&limit=1`;
    let res = await fetch(url);
    let data = await res.json();

    if (data.results.length > 0) {
      document.getElementById("cover").src = data.results[0].artworkUrl100;
    }
  } catch {}
}

function play() {
  document.getElementById("audio").play();
}

setInterval(getMusic, 10000);
getMusic();
</script>

</body>
</html>
